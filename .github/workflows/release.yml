# Publishes a release with semantic-release when main changes.
# Hardening:
# - every action is pinned to a full commit SHA (Dependabot keeps them current);
# - the workflow token is read-only by default; only the release job may write
#   contents (tag, GitHub release, CHANGELOG commit), comment on released
#   issues/PRs and request an OIDC token;
# - npm auth: trusted publishing (OIDC) needs npm >= 11.5.1, which the job
#   installs; until a trusted publisher is configured on npmjs.com the
#   NPM_TOKEN secret (also exported as NODE_AUTH_TOKEN) is the fallback;
#   provenance stays on;
# - dependencies install from the lockfile without lifecycle scripts, and the
#   full quality gate runs before anything is published.
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # tag, GitHub release and the CHANGELOG commit
      issues: write # "released" comments and labels on fixed issues
      pull-requests: write # "released" comments on merged PRs
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Type check (published types)
        run: npm run test:types
      - name: Verify package
        run: npm run verify
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --no-install semantic-release
