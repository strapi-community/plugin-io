# Checks every pull request and push to a non-main branch: lint, formatting,
# tests, type check, build and package verification on the Node versions
# Strapi 5.61 supports.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Type check (published types)
        run: npm run test:types
      - name: Verify package
        run: npm run verify
      - name: Package contents
        run: npm pack --dry-run
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high
